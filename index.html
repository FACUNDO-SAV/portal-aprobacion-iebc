<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portal de Facturas · IEB Construcciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --tinta:#17201D; --tinta-2:#3D4642; --tinta-3:#4A5550; --fondo:#F4F5F2; --papel:#FFFFFF;
  --linea:#D9DDD8; --linea-2:#E6E8E3; --verde:#0E5A52; --verde-osc:#08403A;
  --ambar-f:#FBEBD6; --ambar-t:#6B3906; --rojo:#8E2323; --rojo-f:#F8DEDC; --rojo-t:#7E1E1E;
  --azul-f:#E1EAF6; --azul-t:#1C4677; --ok-f:#DDEFDF; --ok-t:#1B4F2B; --gris-f:#E6E8E3;
  --radio:8px;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--fondo);color:var(--tinta);font:15px/1.45 'IBM Plex Sans','Segoe UI',system-ui,sans-serif;font-variant-numeric:tabular-nums;padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:var(--verde)} a:hover{color:var(--verde-osc)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #5B9BD5;outline-offset:2px}
.barra{background:var(--tinta);color:#F4F5F2;padding-top:env(safe-area-inset-top,0px)}
.barra-in{max-width:1240px;margin:0 auto;padding:10px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px}
.marca{font-weight:600;font-size:16px;white-space:nowrap}
.marca span{font-weight:400;color:#B9C2BD}
.pestanas{display:flex;flex-wrap:wrap;gap:4px;flex:1 1 auto}
.pestanas button{background:none;border:0;color:#D3DAD6;padding:10px 12px;border-radius:6px;cursor:pointer;min-height:44px}
.pestanas button[aria-current="page"]{background:#2C3833;color:#fff;font-weight:500}
.pestanas .n{display:inline-block;min-width:22px;margin-left:6px;padding:0 6px;border-radius:11px;background:#B5651D;color:#fff;font-size:12px;font-weight:600;text-align:center}
.usuario{display:flex;align-items:center;gap:10px;color:#D3DAD6;font-size:14px}
.usuario button{background:none;border:1px solid #4A5550;color:#D3DAD6;border-radius:6px;padding:6px 10px;cursor:pointer;min-height:36px}
main{max-width:1240px;margin:0 auto;padding:24px 20px 64px}
h1{font-size:26px;font-weight:600;margin:0 0 4px}
h2{font-size:18px;font-weight:600;margin:0}
.sub{color:var(--tinta-3);margin:0 0 20px}
.vacio{background:var(--papel);border:1px dashed #B9C0BB;border-radius:var(--radio);padding:32px;text-align:center;color:var(--tinta-3)}
.grupo{margin-bottom:28px}
.grupo-cab{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px}
.grupo-cab small{color:var(--tinta-3)}
.lista{display:flex;flex-direction:column;gap:10px}
.fac{background:var(--papel);border:1px solid var(--linea);border-radius:10px}
.fac>summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;align-items:center;min-height:64px}
.fac>summary::-webkit-details-marker{display:none}
.fac[open]>summary{border-bottom:1px solid var(--linea-2)}
.prov{font-weight:600}
.meta{font-size:13px;color:var(--tinta-3)}
.monto{font-weight:600;font-size:17px;text-align:right;white-space:nowrap}
.cuerpo{padding:16px;display:grid;gap:16px}
@media(min-width:900px){.cuerpo{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.datos{margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}
.datos dt{font-size:12px;color:var(--tinta-3)} .datos dd{margin:2px 0 0}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:500;font-size:12px;color:var(--tinta-2);text-align:left;padding:8px 10px;background:#F7F8F6}
td{padding:8px 10px;border-top:1px solid var(--linea-2)}
td.n,th.n{text-align:right}
.tabla{overflow-x:auto;border:1px solid var(--linea-2);border-radius:6px}
.chip{display:inline-block;font-size:12px;font-weight:500;padding:3px 8px;border-radius:4px;white-space:nowrap;background:var(--gris-f);color:var(--tinta-2)}
.chip.ambar{background:var(--ambar-f);color:var(--ambar-t)} .chip.rojo{background:var(--rojo-f);color:var(--rojo-t)}
.chip.azul{background:var(--azul-f);color:var(--azul-t)} .chip.ok{background:var(--ok-f);color:var(--ok-t)}
.chip.error{background:var(--rojo);color:#fff}
.aviso{border-radius:6px;padding:10px 12px;font-size:14px}
.aviso.ambar{background:var(--ambar-f);color:var(--ambar-t)} .aviso.rojo{background:var(--rojo-f);color:var(--rojo-t)} .aviso.azul{background:var(--azul-f);color:var(--azul-t)}
.acciones{display:flex;flex-direction:column;gap:10px}
.fila{display:flex;flex-wrap:wrap;gap:10px}
label{font-size:13px;font-weight:500;color:var(--tinta-2)}
.campo{display:flex;flex-direction:column;gap:6px;flex:1 1 180px}
input,select,textarea{border:1px solid #B9C0BB;border-radius:6px;padding:10px 12px;background:#fff;min-height:44px}
textarea{resize:vertical;min-height:72px}
.btn{min-height:44px;padding:0 18px;border-radius:6px;border:1px solid #B9C0BB;background:#fff;cursor:pointer;font-weight:500}
.btn.prim{background:var(--verde);border-color:var(--verde);color:#fff}
.btn.peligro{border-color:var(--rojo);color:var(--rojo)}
.btn:disabled{opacity:.55;cursor:progress}
.btn.sug{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;padding:8px 14px;text-align:left;height:auto}
.btn.sug small{font-weight:400;color:var(--tinta-3);font-size:12px}
.historial{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:14px}
.historial time{color:var(--tinta-3);font-size:12px;display:block}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tinta);color:#fff;padding:12px 18px;border-radius:8px;max-width:min(560px,92vw);box-shadow:0 6px 24px rgba(23,32,29,.25);z-index:10}
.toast.error{background:var(--rojo)}
.ingreso{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--tinta);color:#F4F5F2}
.ingreso-in{width:100%;max-width:400px;display:flex;flex-direction:column;gap:28px}
.ingreso h1{font-size:34px;line-height:1.15}
.ingreso p{color:#D3DAD6;margin:0}
.ingreso .btn{width:100%;min-height:52px;font-size:16px}
.ingreso .btn.ms{background:#fff;color:var(--tinta);border-color:#fff;font-weight:600}
.ingreso input{width:100%;background:#22302B;border-color:#4A5550;color:#fff}
.ingreso details summary{cursor:pointer;color:#B9C2BD;font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.panel{background:var(--papel);border:1px solid var(--linea);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:14px;margin-bottom:20px}
@media (prefers-reduced-motion:no-preference){.toast{animation:sube .2s ease-out}@keyframes sube{from{transform:translate(-50%,8px);opacity:0}}}
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<div id="toast" role="status"></div>

<script src="config.js"></script>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm";

const C = window.PORTAL_CONFIG;
const sb = createClient(C.supabaseUrl, C.supabaseKey);
const app = document.getElementById("app");

const S = { sesion: null, email: null, nombre: null, conta: false, uops: [], uopsJefe: [], uopsFirma: [], obras: new Map(), vista: null, datos: {} };

// ---------- utilidades ----------
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pesos = (n, mon = "ARS") => n == null ? "—" :
  (mon && mon !== "ARS" ? mon + " " : "$ ") + Number(n).toLocaleString("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fecha = (d) => d ? new Date(d + (String(d).length === 10 ? "T12:00:00" : "")).toLocaleDateString("es-AR") : "—";
const fechaHora = (d) => d ? new Date(d).toLocaleString("es-AR", { dateStyle: "short", timeStyle: "short" }) : "";
const dias = (d) => d ? Math.max(0, Math.floor((Date.now() - new Date(d)) / 86400000)) : null;
const obrasCircuito = () => [...S.obras.values()].filter((o) => o.activa && o.en_circuito);
const obraNombre = (u) => u == null ? "Sin UOP" : `UOP ${u}${S.obras.get(u) ? " · " + S.obras.get(u).nombre : ""}`;

function avisar(msg, error = false) {
  const t = document.getElementById("toast");
  t.innerHTML = `<div class="toast${error ? " error" : ""}">${esc(msg)}</div>`;
  clearTimeout(avisar.t); avisar.t = setTimeout(() => (t.innerHTML = ""), error ? 7000 : 4000);
}
const ESTADOS = {
  sin_pdf: ["Sin PDF", ""], pendiente_asignacion: ["Asignar UOP", "ambar"], pendiente_aprobacion: ["Pendiente de aprobación", "ambar"],
  pendiente_segunda_firma: ["Segunda firma", "ambar"], rechazada: ["Rechazada", "rojo"], a_validar: ["Revisión de contaduría", "azul"],
  lista_xubio: ["Enviándose a Xubio", "azul"], en_xubio: ["En Xubio", "ok"], error_xubio: ["Error de envío", "error"],
};
const chip = (f) => { const [t, c] = ESTADOS[f] ?? [f ?? "—", ""]; return `<span class="chip ${c}">${esc(t)}</span>`; };
const ACCIONES = { ingreso: "ingresó al circuito", asigno: "asignó la UOP", aprobo: "aprobó", segunda_firma: "dio la segunda firma",
  rechazo: "rechazó", devolvio: "devolvió a asignación", valido: "validó", envio_xubio: "envió a Xubio", error_xubio: "error al enviar a Xubio" };

async function rpc(nombre, args) {
  const { data, error } = await sb.rpc(nombre, args);
  if (error) throw new Error(error.message);
  return data;
}
async function procesarCola() {
  const { data, error } = await sb.functions.invoke("xubio-procesar-cola", { body: {} });
  if (error) return null;
  return data;
}

// ---------- ingreso ----------
function pantallaIngreso(msg) {
  app.innerHTML = `
  <div class="ingreso"><div class="ingreso-in">
    <div><p style="font-size:14px;color:#B9C2BD">IEB Construcciones</p><h1>Portal de Facturas</h1>
    <p>Aprobá las facturas de tus obras. Entrá con tu cuenta de la empresa.</p></div>
    ${msg ? `<div class="aviso rojo">${esc(msg)}</div>` : ""}
    <form data-f="pass" style="display:flex;flex-direction:column;gap:14px">
      <div class="campo"><label for="in-mail" style="color:#D3DAD6">Mail</label>
        <input id="in-mail" type="email" required autocomplete="email" placeholder="nombre@${esc(C.dominioEmpresa)}"></div>
      <div class="campo"><label for="in-pass" style="color:#D3DAD6">Contraseña</label>
        <input id="in-pass" type="password" required autocomplete="current-password"></div>
      <button class="btn prim" type="submit" style="background:#fff;color:var(--tinta);border-color:#fff">Entrar</button>
    </form>
    <details><summary>No tengo contraseña: crear cuenta</summary>
      <form data-f="registro" style="display:flex;flex-direction:column;gap:10px;margin-top:12px">
        <label for="reg-mail" style="color:#D3DAD6">Mail de la empresa</label>
        <input id="reg-mail" type="email" required autocomplete="email" placeholder="nombre@${esc(C.dominioEmpresa)}">
        <label for="reg-pass" style="color:#D3DAD6">Elegí una contraseña</label>
        <input id="reg-pass" type="password" required autocomplete="new-password" minlength="6" placeholder="Mínimo 6 caracteres">
        <button class="btn" type="submit">Crear cuenta</button>
      </form></details>
    <p style="font-size:13px">Solo vas a ver las facturas de las obras que tenés asignadas.</p>
  </div></div>`;
}

// ---------- carga de contexto ----------
async function iniciar() {
  const { data: { session } } = await sb.auth.getSession();
  S.sesion = session;
  if (!session) return pantallaIngreso();
  try {
    S.email = await rpc("mi_email");
    if (!S.email) return pantallaIngreso(`La cuenta ${session.user.email} no tiene acceso. Pedilo a contaduría.`);
    S.conta = await rpc("es_contaduria");
    const [jefe, sup, firma] = await Promise.all(["jefe", "suplente", "segunda_firma"].map((r) => rpc("mis_uops", { p_rol: r })));
    S.uopsJefe = [...new Set([...(jefe ?? []), ...(sup ?? [])])];
    S.uopsFirma = firma ?? [];
    S.uops = [...new Set([...S.uopsJefe, ...S.uopsFirma])];
    const { data: perfil } = await sb.from("perfiles").select("nombre").eq("email", S.email).maybeSingle();
    S.nombre = perfil?.nombre ?? S.email;
    const { data: obras } = await sb.from("obras").select("*").order("uop");
    S.obras = new Map((obras ?? []).map((o) => [o.uop, o]));
    S.vista = S.vista ?? (S.uops.length ? "aprobar" : "asignar");
    await mostrar();
  } catch (e) { pantallaIngreso("No se pudo cargar tu perfil: " + e.message); }
}

function vistas() {
  const v = [];
  if (S.uops.length) v.push(["aprobar", "Para aprobar"]);
  if (S.conta) v.push(["asignar", "Asignar UOP"]);
  if (S.uops.length || S.conta) v.push(["excepciones", "Revisión"], ["circuito", "Todo el circuito"]);
  if (S.conta) v.push(["errores", "Errores de envío"], ["resultados", "Resultados"], ["accesos", "Obras y accesos"]);
  if (S.uops.length) v.push(["historial", "Historial"]);
  return v;
}

function marco(contenido, cuentas = {}) {
  const tabs = vistas().map(([k, t]) =>
    `<button data-a="vista" data-v="${k}" ${S.vista === k ? 'aria-current="page"' : ""}>${t}${cuentas[k] ? `<span class="n">${cuentas[k]}</span>` : ""}</button>`).join("");
  app.innerHTML = `
  <header class="barra"><div class="barra-in">
    <div class="marca">Portal de Facturas <span>· IEB</span></div>
    <nav class="pestanas" aria-label="Secciones">${tabs}</nav>
    <div class="usuario"><span>${esc(S.nombre)}${S.conta ? " · Contaduría" : ""}</span><button data-a="salir">Salir</button></div>
  </div></header>
  <main>${contenido}</main>`;
}

async function contar() {
  const q = (f) => sb.from("facturas").select("id", { count: "exact", head: true }).eq("flujo", f);
  const c = {};
  if (S.uops.length) {
    const [a, b] = await Promise.all([
      sb.from("facturas").select("id", { count: "exact", head: true }).eq("flujo", "pendiente_aprobacion").in("uop_asignada", S.uopsJefe.length ? S.uopsJefe : [-1]),
      sb.from("facturas").select("id", { count: "exact", head: true }).eq("flujo", "pendiente_segunda_firma").in("uop_asignada", S.uopsFirma.length ? S.uopsFirma : [-1]),
    ]);
    c.aprobar = (a.count ?? 0) + (b.count ?? 0);
  }
  if (S.conta) {
    const [a, e, r] = await Promise.all([q("pendiente_asignacion"), q("a_validar"), q("error_xubio")]);
    c.asignar = a.count; c.excepciones = e.count; c.errores = r.count;
  }
  return c;
}

const CAMPOS = "id,cuit,proveedor_nombre,tipo_comprobante,numero_comprobante,moneda,monto,fecha_emision,fecha_vencimiento,flujo,uop_asignada,uop_sugerida,motivo_revision,onedrive_url,nota_completa,xubio_error,xubio_transaccion_id,percepciones,no_gravado,exento,creado_en,actualizado_en";

async function mostrar() {
  marco(`<p class="sub">Cargando…</p>`);
  const cuentas = await contar();
  let html = "";
  try {
    if (S.vista === "aprobar") html = await vistaAprobar();
    else if (S.vista === "asignar") html = (await vistaLista("pendiente_asignacion", "Asignar UOP", `Facturas que apuntan a una obra que trabaja con Xubio (${obrasCircuito().map((o) => o.uop).join(", ") || "ninguna todavía"}). Elegí la UOP y le llega al jefe de esa obra.`, "asignar")) + buscadorIncorporar();
    else if (S.vista === "excepciones") html = await vistaLista("a_validar", "Revisión de contaduría", "Aprobadas por la obra, pero no pueden ir solas a Xubio. El motivo está en cada una.", "revisar");
    else if (S.vista === "errores") html = await vistaLista("error_xubio", "Errores de envío", "Xubio rechazó el envío o faltó algún dato. Corregí y reintentá.", "error");
    else if (S.vista === "circuito") html = await vistaCircuito();
    else if (S.vista === "accesos") html = await vistaAccesos();
    else if (S.vista === "resultados") html = await vistaResultados();
    else if (S.vista === "historial") html = await vistaHistorial();
  } catch (e) { html = `<div class="aviso rojo">No se pudo cargar: ${esc(e.message)}</div>`; }
  marco(html, cuentas);
}

// ---------- tarjeta de factura ----------
function resumen(f, extra = "") {
  const d = dias(f.creado_en);
  return `<summary>
    <div><div class="prov">${esc(f.proveedor_nombre)}</div>
    <div class="meta">${esc(f.tipo_comprobante ?? "")} ${esc(f.numero_comprobante)} · ${fecha(f.fecha_emision)}${d != null ? ` · hace ${d} día${d === 1 ? "" : "s"}` : ""}</div></div>
    <div class="monto">${pesos(f.monto, f.moneda)}</div>
    <div>${chip(f.flujo)} ${extra}</div><div class="meta" style="text-align:right">${f.uop_asignada ? obraNombre(f.uop_asignada) : ""}</div>
  </summary>`;
}

async function detalleBase(f) {
  const [{ data: desg }, { data: hist }] = await Promise.all([
    sb.from("facturas_iva_desglose").select("*").eq("factura_id", f.id),
    sb.from("aprobaciones").select("*").eq("factura_id", f.id).order("creado_en"),
  ]);
  const filas = (desg ?? []).map((x) => `<tr><td>${esc(x.alicuota)}</td><td class="n">${pesos(x.neto)}</td><td class="n">${pesos(x.iva)}</td></tr>`).join("");
  const extras = [["Percepciones", f.percepciones], ["No gravado", f.no_gravado], ["Exento", f.exento]]
    .filter(([, v]) => Number(v) > 0).map(([t, v]) => `<tr><td>${t}</td><td class="n" colspan="2">${pesos(v)}</td></tr>`).join("");
  return `
  <div style="display:flex;flex-direction:column;gap:14px">
    <dl class="datos">
      <div><dt>CUIT</dt><dd>${esc(f.cuit)}</dd></div>
      <div><dt>Vencimiento</dt><dd>${fecha(f.fecha_vencimiento)}</dd></div>
    </dl>
    ${f.nota_completa ? `<div class="meta" style="white-space:pre-line">${esc(f.nota_completa)}</div>` : ""}
    ${f.onedrive_url ? `<a class="btn" style="display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--tinta)" href="${esc(f.onedrive_url)}" target="_blank" rel="noopener">Ver PDF de la factura</a>` : `<div class="aviso ambar">Sin link al PDF</div>`}
    ${filas || extras ? `<div class="tabla"><table><thead><tr><th>Alícuota</th><th class="n">Neto</th><th class="n">IVA</th></tr></thead><tbody>${filas}${extras}</tbody></table></div>` : ""}
  </div>
  <div style="display:flex;flex-direction:column;gap:14px" data-zona="acciones">
    <div data-slot="acciones"></div>
    ${(hist ?? []).length ? `<div><h2 style="font-size:15px;margin-bottom:8px">Historial</h2><ol class="historial">${hist.map((h) =>
      `<li><time>${fechaHora(h.creado_en)}</time>${esc(h.actor_email ?? "Portal")} ${esc(ACCIONES[h.accion] ?? h.accion)}${h.uop ? ` · UOP ${h.uop}` : ""}${h.comentario ? `: “${esc(h.comentario)}”` : ""}</li>`).join("")}</ol></div>` : ""}
  </div>`;
}

// Carga el detalle al abrir una tarjeta (una sola vez).
async function abrir(det) {
  if (det.dataset.cargado) return;
  det.dataset.cargado = "1";
  const cuerpo = det.querySelector(".cuerpo");
  const f = S.datos[det.dataset.id];
  cuerpo.innerHTML = await detalleBase(f);
  const slot = cuerpo.querySelector('[data-slot="acciones"]');
  slot.innerHTML = await accionesPara(f, det.dataset.modo);
}

async function accionesPara(f, modo) {
  const id = esc(f.id);
  if (modo === "aprobar") {
    const segunda = f.flujo === "pendiente_segunda_firma";
    return `<div class="acciones">
      ${segunda ? `<div class="aviso azul">Ya la aprobó el jefe de obra. Supera el umbral de la obra y necesita tu segunda firma.</div>` : ""}
      <div class="campo"><label for="c-${id}">Comentario <span style="font-weight:400;color:var(--tinta-3)">(obligatorio para rechazar o devolver)</span></label>
      <textarea id="c-${id}" placeholder="Ej.: entregado en obra, falta remito…"></textarea></div>
      <div class="fila">
        <button class="btn prim" data-a="aprobar" data-id="${id}" style="flex:1 1 140px">Aprobar</button>
        <button class="btn peligro" data-a="rechazar" data-id="${id}" style="flex:1 1 140px">Rechazar</button>
      </div>
      ${segunda ? "" : `<button class="btn" data-a="devolver" data-id="${id}">No es de mi obra</button>`}
    </div>`;
  }
  if (modo === "asignar") {
    const sug = await rpc("sugerir_uop", { p_factura: f.id }).catch(() => []);
    const opciones = obrasCircuito().map((o) => `<option value="${o.uop}">${esc(obraNombre(o.uop))}</option>`).join("");
    return `<div class="acciones">
      ${f.motivo_revision ? `<div class="aviso ambar">${esc(f.motivo_revision)}</div>` : ""}
      ${(sug ?? []).length ? `<div><h2 style="font-size:15px;margin-bottom:8px">Sugerencias</h2><div class="fila">${sug.map((s) =>
        `<button class="btn sug" data-a="asignar" data-id="${id}" data-uop="${s.uop}"><span>UOP ${s.uop}${s.obra ? " · " + esc(s.obra) : ""}</span><small>${esc(s.motivo)}</small></button>`).join("")}</div></div>`
        : `<div class="aviso azul">Sin antecedentes para este proveedor. Elegí la obra a mano.</div>`}
      <div class="fila" style="align-items:flex-end">
        <div class="campo"><label for="u-${id}">Otra obra</label><select id="u-${id}"><option value="">Elegí una UOP…</option>${opciones}</select></div>
        <button class="btn prim" data-a="asignar-sel" data-id="${id}">Asignar</button>
      </div>
      <details><summary class="meta" style="cursor:pointer">No es de una obra que trabaja con Xubio</summary>
        <div class="fila" style="align-items:flex-end;margin-top:10px">
          <div class="campo"><label for="c-${id}">Motivo</label><input id="c-${id}" placeholder="Ej.: es de la 176"></div>
          <button class="btn" data-a="sacar" data-id="${id}">Devolver al circuito actual</button>
        </div>
        <p class="meta">Sale del portal y sigue por Intranet o Softland como hasta ahora.</p>
      </details>
    </div>`;
  }
  if (modo === "revisar" || modo === "error") {
    const [{ data: lineas }, { data: prov }, { data: prods }] = await Promise.all([
      sb.from("factura_lineas").select("*").eq("factura_id", f.id).order("orden"),
      sb.from("proveedores").select("*").eq("cuit", f.cuit).maybeSingle(),
      sb.from("xubio_productos_compra").select("xubio_id,nombre").order("nombre"),
    ]);
    const nomProd = new Map((prods ?? []).map((p) => [p.xubio_id, p.nombre]));
    const motivo = modo === "error" ? f.xubio_error : f.motivo_revision;
    return `<div class="acciones">
      ${motivo ? `<div class="aviso ${modo === "error" ? "rojo" : "azul"}">${esc(motivo)}</div>` : ""}
      ${(lineas ?? []).length ? `<div class="tabla"><table><thead><tr><th>Línea</th><th>Producto de compra</th><th>UOP</th><th class="n">Importe</th></tr></thead><tbody>${lineas.map((l) =>
        `<tr><td>${esc(l.concepto)}</td><td>${l.es_percepcion ? "Percepción " + esc(l.percepcion_tipo ?? "(sin tipo)") : esc(nomProd.get(l.producto_compra_id) ?? "Sin asignar")}</td><td>${l.uop}</td><td class="n">${pesos(Number(l.neto) + Number(l.importe_iva) + Number(l.no_gravado))}</td></tr>`).join("")}</tbody></table></div>` : ""}
      <form data-f="proveedor" data-id="${id}" data-cuit="${esc(f.cuit)}" data-nombre="${esc(f.proveedor_nombre)}" class="panel" style="margin:0">
        <h2 style="font-size:15px">Imputación habitual del proveedor</h2>
        <div class="fila">
          <div class="campo"><label for="p-${id}">Producto de compra (cuenta)</label>
            <select id="p-${id}" name="producto"><option value="">Elegí…</option>${(prods ?? []).map((p) =>
              `<option value="${p.xubio_id}" ${prov?.producto_compra_id === p.xubio_id ? "selected" : ""}>${esc(p.nombre)}</option>`).join("")}</select></div>
          <div class="campo"><label>Vinculado en Xubio</label><div style="min-height:44px;display:flex;align-items:center">${prov?.xubio_proveedor_id ? "Sí" : "No: crealo en Xubio y sincronizá"}</div></div>
        </div>
        <button class="btn" type="submit">Guardar y recalcular</button>
      </form>
      <div class="fila">
        ${modo === "error"
          ? `<button class="btn prim" data-a="reintentar" data-id="${id}">Reintentar envío</button>`
          : `<button class="btn prim" data-a="validar" data-id="${id}">Validar y enviar a Xubio</button>`}
      </div>
    </div>`;
  }
  return "";
}

function tarjetas(lista, modo) {
  lista.forEach((f) => (S.datos[f.id] = f));

    `<details class="fac" data-id="${esc(f.id)}" data-modo="${modo}">${resumen(f)}<div class="cuerpo"><p class="meta">Cargando…</p></div></details>`).join("")}</div>`;
}

async function vistaResultados() {
  const { data, error } = await sb.from("piloto_tiempos").select("*");
  if (error) throw error;
  const fs = data ?? [];
  const horas = (a, b) => (a && b ? (new Date(b) - new Date(a)) / 3600000 : null);
  const prom = (xs) => { const v = xs.filter((x) => x != null); return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null; };
  const dur = (h) => h == null ? "—" : h < 24 ? `${h.toFixed(1)} h` : `${(h / 24).toFixed(1)} días`;
  const enXubio = fs.filter((f) => f.flujo === "en_xubio");
  const auto = enXubio.filter((f) => !f.paso_por_revision && !f.tuvo_error);
  const pct = enXubio.length ? Math.round((100 * auto.length) / enXubio.length) : null;
  const t = {
    asignar: prom(fs.map((f) => horas(f.ingreso, f.asignada))),
    aprobar: prom(fs.map((f) => horas(f.asignada, f.aprobada))),
    xubio: prom(fs.map((f) => horas(f.aprobada, f.en_xubio))),
    total: prom(fs.map((f) => horas(f.ingreso, f.en_xubio))),
  };
  const enCurso = fs.filter((f) => !["en_xubio", "rechazada"].includes(f.flujo)).length;
  const caja = (titulo, valor, nota) => `<div class="panel" style="margin:0;flex:1 1 200px;gap:4px"><span class="meta">${titulo}</span><span style="font-size:28px;font-weight:600">${valor}</span>${nota ? `<span class="meta">${nota}</span>` : ""}</div>`;
  if (!fs.length) return `<h1>Resultados</h1><div class="vacio">Todavía no entró ninguna factura al circuito. Cuando arranque el piloto, acá vas a ver cuánto tarda cada paso y cuántas llegan solas a Xubio.</div>`;
  return `<h1>Resultados</h1><p class="sub">Cómo está funcionando el circuito en ${obrasCircuito().map((o) => "la UOP " + o.uop).join(", ") || "las obras habilitadas"}. Sirve para decidir si se extiende al resto de las obras.</p>
    <div class="fila" style="margin-bottom:16px">
      ${caja("Facturas en el circuito", fs.length, `${enCurso} en curso`)}
      ${caja("Contabilizadas en Xubio", enXubio.length, "")}
      ${caja("Llegaron solas a Xubio", pct == null ? "—" : pct + " %", "Sin revisión ni errores")}
      ${caja("Rechazadas por la obra", fs.filter((f) => f.flujo === "rechazada").length, "")}
    </div>
    <section class="panel"><h2>Cuánto tarda cada paso (promedio)</h2>
      <div class="tabla"><table><thead><tr><th>Paso</th><th class="n">Tiempo</th></tr></thead><tbody>
        <tr><td>Ingreso → UOP asignada (contaduría)</td><td class="n">${dur(t.asignar)}</td></tr>
        <tr><td>UOP asignada → aprobada (jefe de obra)</td><td class="n">${dur(t.aprobar)}</td></tr>
        <tr><td>Aprobada → contabilizada en Xubio</td><td class="n">${dur(t.xubio)}</td></tr>
        <tr><td><strong>Total, de punta a punta</strong></td><td class="n"><strong>${dur(t.total)}</strong></td></tr>
      </tbody></table></div>
      <p class="meta" style="margin:0">Para comparar, conviene medir cuánto tarda hoy una factura por Intranet o Softland.</p>
    </section>`;
}

async function vistaAprobar() {
  const [r1, r2] = await Promise.all([
    sb.from("facturas").select(CAMPOS).eq("flujo", "pendiente_aprobacion").in("uop_asignada", S.uopsJefe.length ? S.uopsJefe : [-1]).order("creado_en"),
    sb.from("facturas").select(CAMPOS).eq("flujo", "pendiente_segunda_firma").in("uop_asignada", S.uopsFirma.length ? S.uopsFirma : [-1]).order("creado_en"),
  ]);
  if (r1.error) throw r1.error;
  if (r2.error) throw r2.error;
  const data = [...(r1.data ?? []), ...(r2.data ?? [])];
  const porObra = new Map();
  for (const f of data ?? []) { if (!porObra.has(f.uop_asignada)) porObra.set(f.uop_asignada, []); porObra.get(f.uop_asignada).push(f); }
  const cab = `<h1>Para aprobar</h1><p class="sub">Solo ves las obras que tenés asignadas.</p>`;
  if (!porObra.size) return cab + `<div class="vacio">No tenés facturas pendientes. Cuando contaduría te asigne una, te va a aparecer acá.</div>`;
  return cab + [...porObra].map(([uop, fs]) =>
    `<section class="grupo"><div class="grupo-cab"><h2>${esc(obraNombre(uop))}</h2><small>${fs.length} pendiente${fs.length === 1 ? "" : "s"}</small></div>${tarjetas(fs, "aprobar")}</section>`).join("");
}

// ---------- acciones ----------
async function ejecutar(btn, fn) {
  const todos = btn.closest(".acciones, form, main")?.querySelectorAll("button") ?? [btn];
  todos.forEach((b) => (b.disabled = true));
  try { await fn(); } catch (e) { avisar(e.message, true); todos.forEach((b) => (b.disabled = false)); }
}
const comentario = (id) => document.getElementById("c-" + id)?.value.trim() ?? "";

app.addEventListener("toggle", (e) => { if (e.target.matches("details.fac") && e.target.open) abrir(e.target); }, true);

app.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-a]");
  if (!b) return;
  const a = b.dataset.a, id = b.dataset.id;
  if (a === "salir") { await sb.auth.signOut(); S.vista = null; return pantallaIngreso(); }
  if (a === "vista") { S.vista = b.dataset.v; return mostrar(); }

  if (a === "aprobar") return ejecutar(b, async () => {
    const nuevo = await rpc("aprobar_factura", { p_factura: id, p_comentario: comentario(id) || null });
    if (nuevo === "lista_xubio") { avisar("Aprobada. Se está enviando a Xubio."); procesarCola(); }
    else if (nuevo === "pendiente_segunda_firma") avisar("Aprobada. Supera el umbral: pasa a segunda firma.");
    else avisar("Aprobada. Contaduría la revisa antes de enviarla a Xubio.");
    await mostrar();
  });
  if (a === "rechazar" || a === "devolver") {
    const c = comentario(id);
    if (!c) { avisar(a === "rechazar" ? "Escribí el motivo del rechazo." : "Contá por qué no es de tu obra.", true); document.getElementById("c-" + id)?.focus(); return; }
    return ejecutar(b, async () => {
      await rpc(a === "rechazar" ? "rechazar_factura" : "devolver_a_asignacion", { p_factura: id, p_comentario: c });
      avisar(a === "rechazar" ? "Rechazada." : "Devuelta a contaduría para reasignar.");
      await mostrar();
    });
  }
  if (a === "asignar" || a === "asignar-sel") {
    const uop = Number(a === "asignar" ? b.dataset.uop : document.getElementById("u-" + id)?.value);
    if (!uop) return avisar("Elegí una UOP.", true);
    return ejecutar(b, async () => { await rpc("asignar_uop", { p_factura: id, p_uop: uop }); avisar(`Asignada a la UOP ${uop}. Ya le llegó al jefe de obra.`); await mostrar(); });
  }
  if (a === "sacar") {
    const c = comentario(id);
    if (!c) { avisar("Indicá el motivo.", true); return; }
    return ejecutar(b, async () => { await rpc("sacar_del_circuito", { p_factura: id, p_comentario: c }); avisar("Devuelta al circuito actual."); await mostrar(); });
  }
  if (a === "incorporar") return ejecutar(b, async () => {
    await rpc("incorporar_al_circuito", { p_factura: id }); avisar("Incorporada. Ya está para asignar."); await mostrar();
  });
  if (a === "circuito-obra") return ejecutar(b, async () => {
    const { error } = await sb.from("obras").update({ en_circuito: b.dataset.on === "1" }).eq("uop", Number(b.dataset.uop));
    if (error) throw error; avisar(b.dataset.on === "1" ? `La UOP ${b.dataset.uop} pasa a trabajar con Xubio.` : `La UOP ${b.dataset.uop} vuelve al circuito actual.`); await iniciar();
  });
  if (a === "validar") return ejecutar(b, async () => {
    await rpc("validar_factura", { p_factura: id, p_comentario: null });
    avisar("Validada. Se está enviando a Xubio."); await procesarCola(); await mostrar();
  });
  if (a === "reintentar") return ejecutar(b, async () => {
    const { data, error } = await sb.functions.invoke("xubio-enviar-factura", { body: { factura_id: id } });
    if (error || !data?.ok) throw new Error(data?.error ?? "Xubio no aceptó el envío. El detalle quedó en la factura.");
    avisar("Enviada a Xubio."); await mostrar();
  });
  if (a === "quitar-acceso") return ejecutar(b, async () => {
    const { error } = await sb.from("obra_aprobadores").delete().match({ uop: Number(b.dataset.uop), email: b.dataset.email, rol: b.dataset.rol });
    if (error) throw error; avisar("Acceso quitado."); await mostrar();
  });
});

app.addEventListener("submit", async (e) => {
  const f = e.target.closest("form[data-f]");
  if (!f) return;
  e.preventDefault();
  const v = Object.fromEntries(new FormData(f));
  const btn = f.querySelector('button[type="submit"]');
  if (f.dataset.f === "pass") {
    const email = document.getElementById("in-mail").value.trim().toLowerCase();
    const password = document.getElementById("in-pass").value;
    const { error } = await sb.auth.signInWithPassword({ email, password });
    return error ? pantallaIngreso("Mail o contraseña incorrectos.") : null;
  }
  if (f.dataset.f === "registro") {
    const email = document.getElementById("reg-mail").value.trim().toLowerCase();
    const password = document.getElementById("reg-pass").value;
    if (password.length < 6) return avisar("La contraseña tiene que tener al menos 6 caracteres.", true);
    const { data: su, error } = await sb.auth.signUp({ email, password, options: { data: { email } } });
    if (error) return avisar(error.message, true);
    if (su?.user?.identities?.length === 0) return avisar("Ya existe una cuenta con ese mail. Usá el formulario de arriba para entrar.", true);
    return null;
  }
  if (f.dataset.f === "buscar") {
    const t = String(v.texto ?? "").trim();
    if (t.length < 3) return avisar("Escribí al menos 3 caracteres.", true);
    const desde = new Date(Date.now() - 90 * 86400000).toISOString();
    const { data, error } = await sb.from("facturas").select(CAMPOS).is("flujo", null).neq("destino", "no_factura").gte("creado_en", desde)
      .or(`numero_comprobante.ilike.%${t}%,cuit.ilike.%${t}%,proveedor_nombre.ilike.%${t}%`).order("creado_en", { ascending: false }).limit(10);
    const zona = document.getElementById("resultados-busqueda");
    if (error) return avisar(error.message, true);
    zona.innerHTML = (data ?? []).length ? `<div class="tabla"><table><tbody>${data.map((x) => `<tr><td><div class="prov">${esc(x.proveedor_nombre)}</div><div class="meta">${esc(x.numero_comprobante)} · ${fecha(x.fecha_emision)}</div></td>
      <td class="n">${pesos(x.monto, x.moneda)}</td><td><button class="btn" data-a="incorporar" data-id="${esc(x.id)}">Incorporar</button></td></tr>`).join("")}</tbody></table></div>`
      : `<p class="meta">No hay facturas de los últimos 90 días fuera del circuito con ese dato.</p>`;
    return;
  }
  if (f.dataset.f === "obra") return ejecutar(btn, async () => {
    const { error } = await sb.from("obras").insert({ uop: Number(v.uop), nombre: v.nombre.trim(), umbral_segunda_firma: v.umbral ? Number(v.umbral) : null });
    if (error) throw error; avisar("Obra agregada."); await iniciar();
  });
  if (f.dataset.f === "persona") return ejecutar(btn, async () => {
    const { error } = await sb.from("perfiles").insert({ email: v.email.trim().toLowerCase(), nombre: v.nombre.trim(), es_contaduria: v.conta === "si" });
    if (error) throw error; avisar("Persona dada de alta. Ya puede ingresar con Microsoft."); await mostrar();
  });
  if (f.dataset.f === "acceso") return ejecutar(btn, async () => {
    const { error } = await sb.from("obra_aprobadores").insert({ uop: Number(v.uop), email: v.email, rol: v.rol, vigente_hasta: v.hasta || null });
    if (error) throw error; avisar("Acceso otorgado."); await mostrar();
  });
  if (f.dataset.f === "proveedor") return ejecutar(btn, async () => {
    if (!v.producto) throw new Error("Elegí el producto de compra.");
    const { error } = await sb.from("proveedores").upsert({ cuit: f.dataset.cuit, nombre: f.dataset.nombre, producto_compra_id: Number(v.producto), actualizado_en: new Date().toISOString() });
    if (error) throw error;
    const nuevo = await rpc("recalcular_envio", { p_factura: f.dataset.id });
    if (nuevo === "lista_xubio") { avisar("Listo: ahora va sola a Xubio."); await procesarCola(); }
    else avisar("Guardado. Todavía queda algo para revisar.");
    await mostrar();
  });
});

// Arranca una sola vez con la sesión inicial y vuelve a cargar al entrar o salir.
let ultimoUsuario;
sb.auth.onAuthStateChange((evento, sesion) => {
  const u = sesion?.user?.id ?? null;
  if (evento === "INITIAL_SESSION" || u !== ultimoUsuario) { ultimoUsuario = u; iniciar(); }
});
</script>
